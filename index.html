/* ============================================================
   만덕 아트 클래스 — 디자인 시스템
   ============================================================ */
:root{
  --paper:#FFF9F2; --paper2:#FFF2E6; --ink:#2D2A26; --ink2:#6B655D;
  --line:#EFE3D6; --card:#FFFFFF;
  --coral:#F4633A; --coral-soft:#FFE4DB;
  --sky:#3E8FD0; --sky-soft:#DDEEFB;
  --mint:#2FB894; --mint-soft:#DCF5EE;
  --sun:#F5B940; --sun-soft:#FDF0D2;
  --violet:#8A6FD0; --violet-soft:#EAE3F8;
  --rose:#E85C8A;
  --chalk:#17171a; --chalk2:#1d1d21; --chalk-bg:#0f0f10; --cream:#f4f1ec; --cream2:#8f8a80;
  --radius:16px; --radius-s:10px;
  --shadow:0 2px 10px rgba(45,42,38,.07);
  --shadow-lg:0 10px 30px rgba(45,42,38,.13);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);color:var(--ink);background:var(--paper);
  background-image:radial-gradient(circle at 12% 8%,rgba(244,99,58,.05) 0 140px,transparent 141px),
                   radial-gradient(circle at 88% 92%,rgba(62,143,208,.06) 0 160px,transparent 161px);
  min-height:100vh;font-size:15px;line-height:1.6;letter-spacing:-.01em;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--sky);text-decoration:none}
img{max-width:100%}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 90px}
.wrap.wide{max-width:1040px}

/* ---------- 공통 UI ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 20px;border-radius:999px;font-weight:700;font-size:15px;
  transition:transform .12s,box-shadow .12s,filter .12s;user-select:none;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 4px 14px rgba(244,99,58,.35)}
.btn-sky{background:var(--sky);color:#fff;box-shadow:0 4px 14px rgba(62,143,208,.35)}
.btn-mint{background:var(--mint);color:#fff;box-shadow:0 4px 14px rgba(47,184,148,.35)}
.btn-ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--coral);color:var(--coral)}
.btn-white{background:#fff;box-shadow:var(--shadow)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-lg{padding:15px 26px;font-size:17px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.h-title{font-family:"Gyeombalbal","Apple SD Gothic Neo",sans-serif;font-size:20px;font-weight:800;letter-spacing:-.02em}
.h-sub{color:var(--ink2);font-size:13.5px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.tag-coral{background:var(--coral-soft);color:var(--coral)}
.tag-sky{background:var(--sky-soft);color:var(--sky)}
.tag-mint{background:var(--mint-soft);color:var(--mint)}
.tag-sun{background:var(--sun-soft);color:#B8860B}
.tag-violet{background:var(--violet-soft);color:var(--violet)}
.tag-gray{background:#F0EBE4;color:var(--ink2)}
.field{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;
  background:#fff;outline:none;transition:border-color .15s}
.field:focus{border-color:var(--coral)}
textarea.field{resize:vertical;min-height:70px;line-height:1.55}
label.lbl{display:block;font-weight:700;font-size:13.5px;margin:14px 0 6px;color:var(--ink)}
.hint{font-size:12.5px;color:var(--ink2);margin-top:5px}
.divider{height:1.5px;background:var(--line);border:none;margin:16px 0}
.row{display:flex;gap:10px;align-items:center}
.row.wrapf{flex-wrap:wrap}
.spacer{flex:1}
.center{text-align:center}

/* ---------- 토스트 ---------- */
#toast-root{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:999;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;
  font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .25s ease;max-width:86vw;text-align:center}
.toast.ok{background:var(--mint)} .toast.err{background:#D64545}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ---------- 배경 음악 토글 ---------- */
#bgm-btn{position:fixed;right:14px;bottom:14px;z-index:850;display:flex;align-items:center;gap:6px;
  border:1.5px solid #17171a;border-radius:999px;background:#f4f1ec;box-shadow:3px 4px 0 rgba(23,23,27,.55);
  font:700 12px/1 var(--sans);letter-spacing:.06em;color:#17171a;padding:9px 14px;cursor:pointer;
  transition:transform .09s,box-shadow .09s,opacity .2s}
#bgm-btn:hover{transform:translate(1px,2px);box-shadow:2px 2px 0 rgba(23,23,27,.55)}
#bgm-btn:active{transform:translate(3px,4px);box-shadow:0 0 0 rgba(0,0,0,0)}
#bgm-btn.bgm-off{opacity:.55;text-decoration:line-through}
#bgm-btn::before{content:"";width:8px;height:8px;border-radius:50%;background:#7ecfae;flex:none}
#bgm-btn.bgm-off::before{background:#b9b2a4}

/* ---------- 모달 ---------- */
#modal-root{position:fixed;inset:0;z-index:900;display:none}
#modal-root.open{display:flex;align-items:center;justify-content:center;padding:18px}
.modal-bg{position:absolute;inset:0;background:rgba(45,42,38,.5);backdrop-filter:blur(2px)}
.modal{position:relative;background:#fff;border-radius:20px;max-width:640px;width:100%;
  max-height:88vh;overflow:auto;padding:24px;box-shadow:var(--shadow-lg);animation:toastIn .22s ease}
.modal h3{font-size:18px;font-weight:800;margin-bottom:6px}

/* ============================================================
   환영 화면 (Welcome to Mandeok Art Class)
   ============================================================ */
#view-welcome.on{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;overflow:hidden;position:relative;padding:30px 16px;text-align:center}
.blob{position:absolute;border-radius:50%;filter:blur(1px);opacity:.85;pointer-events:none}
.blob.b1{width:120px;height:120px;background:radial-gradient(circle at 35% 30%,#FFD3C4,#F4633A);
  top:8%;left:6%;animation:float1 7s ease-in-out infinite}
.blob.b2{width:74px;height:74px;background:radial-gradient(circle at 35% 30%,#CFE8FB,#3E8FD0);
  top:16%;right:9%;animation:float2 8.5s ease-in-out infinite}
.blob.b3{width:56px;height:56px;background:radial-gradient(circle at 35% 30%,#FDF0C8,#F5B940);
  bottom:14%;left:12%;animation:float2 6.5s ease-in-out infinite .8s}
.blob.b4{width:88px;height:88px;background:radial-gradient(circle at 35% 30%,#C8F1E4,#2FB894);
  bottom:9%;right:8%;animation:float1 9s ease-in-out infinite .4s}
.blob.b5{width:34px;height:34px;background:radial-gradient(circle at 35% 30%,#EAE3F8,#8A6FD0);
  top:52%;left:20%;animation:float2 7.4s ease-in-out infinite 1.4s}
@keyframes float1{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-22px) rotate(9deg)}}
@keyframes float2{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(16px) rotate(-8deg)}}
.confetti{position:fixed;top:0;left:0;width:9px;height:9px;border-radius:2px;pointer-events:none;
  opacity:.9;z-index:880;animation:conf-fall linear infinite}
@keyframes conf-fall{0%{transform:translate3d(0,-8vh,0) rotate(0)}100%{transform:translate3d(0,108vh,0) rotate(660deg)}}

.mascot-stage{position:relative;margin-bottom:8px}
.mascot{width:190px;height:190px;filter:drop-shadow(0 12px 22px rgba(244,99,58,.28));
  animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
.m-eyes{animation:blink 4.6s ease-in-out infinite;transform-origin:center}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.06)}}
.mascot.m-happy{animation:mhop .7s ease-in-out infinite}
@keyframes mhop{0%,100%{transform:translateY(0)}45%{transform:translateY(-12px) rotate(2deg)}}
.mascot.m-sad{animation:mslump .9s ease-in-out infinite}
@keyframes mslump{0%,100%{transform:translateY(0)}50%{transform:translateY(5px) rotate(-3deg)}}
.m-tear{animation:mtear 1.6s ease-in infinite}
@keyframes mtear{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(16px)}}
.quiz-mascot{display:flex;justify-content:center;margin:4px 0 2px}
.quiz-mascot-sm{flex:0 0 auto;margin-top:2px}
.qh-body{flex:1;min-width:0}
.quiz-hint{display:flex;gap:10px;align-items:flex-start}
.m-brush{animation:wave 2.6s ease-in-out infinite;transform-origin:150px 128px}
@keyframes wave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(13deg)}}
.m-speech{position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:#fff;
  border:2px solid var(--coral);color:var(--coral);font-weight:800;font-size:14px;
  padding:7px 16px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow);
  animation:speechPop .5s cubic-bezier(.3,1.6,.5,1) both .3s}
.m-speech::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:var(--coral);border-bottom:none}
@keyframes speechPop{from{opacity:0;transform:translateX(-50%) scale(.4)}to{opacity:1;transform:translateX(-50%) scale(1)}}

.w-title{font-size:clamp(30px,7vw,52px);font-weight:900;letter-spacing:-.02em;line-height:1.15;
  background:linear-gradient(100deg,var(--coral),var(--rose) 45%,var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0 2px}
.w-kr{font-size:clamp(15px,3.6vw,19px);color:var(--ink2);font-weight:600;margin-bottom:26px}
.w-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.w-foot{position:absolute;bottom:14px;left:0;right:0;font-size:11.5px;color:var(--ink2)}
.w-badge{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);
  border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--ink2);
  margin-bottom:14px;box-shadow:var(--shadow)}
.w-badge i{width:8px;height:8px;border-radius:50%;background:var(--mint);display:inline-block;
  animation:pulseDot 1.6s infinite}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}

/* ---------- 역할 입장 ---------- */
.entry-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media(max-width:560px){.entry-cards{grid-template-columns:1fr}}
.entry-card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:22px 18px;
  text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s;cursor:pointer}
.entry-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.entry-card.sel{border-color:var(--coral);background:var(--coral-soft)}
.entry-card .ec-t{font-family:"Gyeombalbal","Apple SD Gothic Neo",sans-serif;font-size:17px;font-weight:800;margin:8px 0 4px}
.entry-card .ec-d{font-size:12.5px;color:var(--ink2);line-height:1.5}
.ec-ico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center}

/* ---------- 헤더/네비 ---------- */
.appbar{position:sticky;top:0;z-index:50;background:rgba(23,23,26,.97);backdrop-filter:blur(8px);
  border-bottom:none;color:var(--cream)}
.appbar::after{content:"";display:block;height:4px;flex:none;
  background:linear-gradient(90deg,#7ecfae 0%,#94d1e4 16%,#cfc0e9 33%,#e78ba0 50%,#fac042 66%,#db873f 83%,#c62e47 100%)}
.appbar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.appbar .logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:16.5px;letter-spacing:-.02em}
.logo-dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--coral),var(--rose));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900;flex:none}
.tabbar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:700;color:rgba(244,241,236,.78);
  white-space:nowrap;transition:background .15s,color .15s}
.tabbar button.on{background:var(--cream);color:var(--chalk)}
.tabbar button:hover:not(.on){background:rgba(244,241,236,.14)}
.userchip{display:flex;align-items:center;gap:7px;background:rgba(244,241,236,.12);
  border:1.5px solid rgba(244,241,236,.45);color:var(--cream);
  padding:5px 12px 5px 6px;border-radius:999px;font-size:12.5px;font-weight:700;flex:none}
.userchip .avatar{width:24px;height:24px;border-radius:50%;background:var(--sun-soft);color:#B8860B;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}

/* ---------- 학생 홈 ---------- */
.hero-card{background:var(--chalk);color:var(--cream);border:1.5px solid var(--cream);border-radius:14px;
  padding:0;position:relative;overflow:hidden;box-shadow:7px 9px 0 rgba(23,23,26,.22)}
.hero-card h2{font-family:"Gyeombalbal","Apple SD Gothic Neo",sans-serif;font-size:22px;font-weight:700;
  letter-spacing:-.01em;margin-bottom:4px}
.hero-card p{font-size:13.5px;opacity:.88}
.hero-card .cwin-body{padding:16px 20px 18px}
.hero-card .tag-hero{background:rgba(244,241,236,.16);color:var(--cream)}
.hero-card .h-title{color:var(--cream)}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
@media(max-width:560px){.menu-grid{grid-template-columns:repeat(2,1fr)}}
.menu-tile{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 12px;
  text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative}
.menu-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--coral)}
.menu-tile .mt-ico{width:48px;height:48px;margin:0 auto 8px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;font-size:22px}
.menu-tile .mt-t{font-weight:800;font-size:14px}
.menu-tile .mt-d{font-size:11px;color:var(--ink2);margin-top:2px}
.badge-dot{position:absolute;top:9px;right:11px;min-width:19px;height:19px;border-radius:999px;
  background:var(--rose);color:#fff;font-size:10.5px;font-weight:800;display:flex;
  align-items:center;justify-content:center;padding:0 5px}
.section{margin-top:22px}
.list-item{display:flex;gap:12px;align-items:center;padding:13px 6px;border-bottom:1.5px solid var(--line)}
.list-item:last-child{border-bottom:none}

/* ---------- 아이디어 공방 스텝 ---------- */
.steps{display:flex;gap:6px;margin:14px 0 18px;overflow-x auto}
.step-pill{flex:1;min-width:64px;text-align:center;padding:8px 4px;border-radius:12px;
  background:#fff;border:2px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);
  cursor:pointer;transition:all .15s}
.step-pill .sp-n{display:block;font-size:15px;margin-bottom:1px}
.step-pill.done{background:var(--mint-soft);border-color:var(--mint);color:var(--mint)}
.step-pill.now{background:var(--ink);border-color:var(--ink);color:#fff}
.mindmap-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--paper2);border:1.5px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--coral);color:var(--coral);transform:scale(1.05)}
.chip.on{background:var(--coral);border-color:var(--coral);color:#fff}
.canvas-box{position:relative;background:#fff;border:2px dashed var(--line);border-radius:14px;
  overflow:hidden;min-height:220px;display:flex;align-items:center;justify-content:center}
.canvas-box canvas{max-width:100%;display:block}
.diag-report{margin-top:14px}
.diag-item{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:#fff;
  border:1.5px solid var(--line);margin-bottom:8px;font-size:13.5px}
.diag-item .di-ico{flex:none;width:26px;height:26px;border-radius:8px;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff}

/* ---------- 챗봇 ---------- */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 132px);min-height:420px}
.chat-log{flex:1;overflow-y:auto;padding:4px 2px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;animation:toastIn .18s ease}
.msg.bot{background:#fff;border:1.5px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--ink);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.msg .msg-src{display:block;margin-top:8px;padding-top:8px;border-top:1.5px dashed var(--line);
  font-size:11.5px;color:var(--ink2)}
.msg .msg-src b{color:var(--ink)}
.chat-input{display:flex;gap:8px;padding-top:10px;border-top:1.5px solid var(--line)}
.chat-input input{flex:1}
.chat-quick{display:flex;gap:7px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.chat-quick::-webkit-scrollbar{display:none}
.chat-quick .chip{flex:none;font-size:12.5px}
.ai-mode-tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--violet-soft);color:var(--violet)}

/* ---------- 퀴즈 ---------- */
.quiz-top{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap}
.q-prog{height:9px;border-radius:99px;background:var(--paper2);overflow:hidden;flex:1;min-width:120px}
.q-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));
  border-radius:99px;transition:width .4s cubic-bezier(.3,1,.4,1)}
.q-badge{font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px}
.quiz-q{font-size:17.5px;font-weight:800;line-height:1.5;margin:8px 0 4px}
.quiz-q .q-num{color:var(--coral)}
.quiz-opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.qopt{text-align:left;padding:14px 16px;border-radius:14px;background:#fff;border:2px solid var(--line);
  font-size:14.5px;font-weight:600;transition:all .15s;display:flex;gap:10px;align-items:center}
.qopt .on-num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--paper2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:900;color:var(--ink2)}
.qopt:hover{border-color:var(--coral)}
/* 단계 클리어 전체 축하 오버레이 */
#cheer-root{position:fixed;inset:0;z-index:9000;background:rgba(45,42,38,.62);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:cheerIn .35s ease-out;overflow:hidden}
#cheer-root .m-dance{position:relative;animation:mdance .95s ease-in-out infinite;z-index:2}
@keyframes mdance{0%,100%{transform:translateY(0) rotate(-7deg) scale(1)}
  25%{transform:translateY(-20px) rotate(7deg) scale(1.07)}
  50%{transform:translateY(0) rotate(-7deg) scale(1)}
  75%{transform:translateY(-20px) rotate(9deg) scale(1.07)}}
.cheer-rays{position:absolute;inset:-60%;z-index:1;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(255,201,60,.18) 0 10deg,transparent 10deg 22deg);
  animation:rayspin 7s linear infinite}
@keyframes rayspin{to{transform:rotate(360deg)}}
.cheer-t{position:relative;z-index:2;font-family:"Gyeombalbal","Apple SD Gothic Neo",sans-serif;font-size:32px;font-weight:900;color:#fff;letter-spacing:-.5px;
  text-shadow:0 4px 20px rgba(0,0,0,.4);margin-top:10px}
.cheer-s{position:relative;z-index:2;font-size:15px;color:#FFF3E4;margin-top:6px}
.cheer-skip{position:relative;z-index:2;margin-top:22px;background:rgba(255,255,255,.92);border:none;
  border-radius:999px;padding:11px 26px;font:inherit;font-weight:800;cursor:pointer;color:var(--coral)}
.cheer-conf{position:fixed;z-index:9001}
.qopt.wrong-pick{border-color:#D64545;background:#FDECEC}
.qopt.chosen{border-color:var(--coral);background:var(--coral-soft)}
.qopt.correct{border-color:var(--mint);background:var(--mint-soft)}
.qopt[disabled]{cursor:default}
.quiz-hint{background:var(--sun-soft);border:2px dashed var(--sun);border-radius:14px;padding:14px 16px;
  margin-top:14px;font-size:14px;animation:toastIn .25s ease}
.quiz-hint .qh-t{font-weight:800;color:#B8860B;font-size:12.5px;margin-bottom:4px}
.quiz-feedback{border-radius:14px;padding:15px 17px;margin-top:14px;font-size:14px;line-height:1.6;
  animation:toastIn .25s ease}
.qf-good{background:var(--mint-soft);border:2px solid var(--mint)}
.qf-bad{background:#FDECEC;border:2px solid #D64545}
.result-rank{text-align:center;padding:10px 0}
.result-rank .rr-big{font-size:44px;font-weight:900;background:linear-gradient(100deg,var(--coral),var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.heatmap{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:8px}
.heat-cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:800;color:#fff}

/* ---------- 자료실 ---------- */
.kb-cat{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.kb-cat::-webkit-scrollbar{display:none}
.kb-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:520px){.kb-grid{grid-template-columns:1fr}}
.kb-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;
  transition:transform .15s,border-color .15s}
.kb-card:hover{transform:translateY(-2px);border-color:var(--coral)}
.kb-card .kb-name{font-weight:800;font-size:15px;margin:7px 0 3px}
.kb-card .kb-one{font-size:12.5px;color:var(--ink2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ref-links{display:flex;flex-wrap:wrap;gap:9px}
.ref-link{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;transition:all .12s}
.ref-link:hover{border-color:var(--sky);color:var(--sky);transform:translateY(-1px)}

/* ---------- 성찰 ---------- */
.reflect-photo{width:100%;max-height:340px;object-fit:contain;border-radius:14px;background:#FBF7F2}
.starter{background:var(--paper2);border-left:3px solid var(--sun);padding:8px 12px;border-radius:0 10px 10px 0;
  font-size:12.5px;color:var(--ink2);margin-top:6px;cursor:pointer}
.starter:hover{color:var(--ink)}

/* ---------- 교사 대시보드 ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:14px 0}
@media(max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-box{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat-box .st-n{font-size:24px;font-weight:900}
.stat-box .st-l{font-size:11.5px;color:var(--ink2);font-weight:700;margin-top:2px}

<script>
/* 부팅 오류 가시화 훅 — JS 환경 문제로 화면이 비면 원인을 화면에 보여준다 */
(function(){
  function banner(msg){
    var el=document.getElementById("boot-error");
    if(!el){el=document.createElement("div");el.id="boot-error";
      el.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#7a1f1f;color:#fff;font:12px/1.5 sans-serif;padding:8px 12px;white-space:pre-wrap";
      (document.body||document.documentElement).appendChild(el);}
    el.textContent=msg;
  }
  window.addEventListener("error",function(e){
    banner("오류: "+(e.message||e.type)+(e.filename?" @ "+e.lineno+"행":"")+"\n(이 문구가 보이면 스크린샷과 함께 보고해 주세요)");
  },true);
  window.addEventListener("unhandledrejection",function(e){
    banner("비동기 오류: "+((e.reason&&e.reason.message)||String(e.reason)));
  });
  window.__mdBanner=banner;
})();
</script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }

      var maxEcCount = 0;

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

function compressImage(file,maxW,quality){
  return new Promise((res,rej)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const r=Math.min(1,maxW/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",quality||0.72));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("이미지를 읽지 못했습니다"));};
    img.src=url;
  });

let _audioCtx=null;
function sndTone(f,t0,dur,type,vol){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    _audioCtx=_audioCtx||new AC();
    if(_audioCtx.state==="suspended"){_audioCtx.resume().catch(()=>{});}
    const t=_audioCtx.currentTime+t0;
    const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
    o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol||.12,t+.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(_audioCtx.destination);
    o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}

const bgm={on:false,hinted:false,master:null,nodes:[],timer:null,nextT:0};

function bgmCtx(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  if(!_audioCtx){
    _audioCtx=new AC();
    /* 정책/제스처로 나중에 running이 되면 즉시 시작(재시도 보험) */
    _audioCtx.onstatechange=()=>{

  return _audioCtx;
}

function bgmPad(f,t0,dur,vol){
  const c=bgmCtx();if(!c)return;
  const g=c.createGain(),lp=c.createBiquadFilter();

    const o=c.createOscillator();o.type=i?"sine":"triangle";o.frequency.value=fr;
    o.connect(lp);o.start(t0);o.stop(t0+dur);bgmNode(o);
  });
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+1.4);
  g.gain.setValueAtTime(vol,t0+dur-1.6);
  g.gain.linearRampToValueAtTime(0.0001,t0+dur);

function bgmPluck(f,t0,vol){
  const c=bgmCtx();if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
  o.type="sine";o.frequency.value=f;
  lp.type="lowpass";lp.frequency.value=2200;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.03);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+.9);
  o.connect(lp);lp.connect(g);g.connect(bgm.master);
  o.start(t0);o.stop(t0+1);bgmNode(o);
}
function bgmBell(f,t0,vol){
  const c=bgmCtx();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type="sine";o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.06);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+2.6);
  o.connect(g);g.connect(bgm.master);
  o.start(t0);o.stop(t0+2.7);bgmNode(o);
}
function bgmAir(){
  const c=bgmCtx();if(!c)return;
  const len=2*c.sampleRate,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=c.createBufferSource(),g=c.createGain(),lp=c.createBiquadFilter();
  s.buffer=buf;s.loop=true;
  lp.type="lowpass";lp.frequency.value=800;
  g.gain.value=.016;
  s.connect(lp);lp.connect(g);g.connect(bgm.master);
  s.start();bgmNode(s);
}
function bgmScheduleLoop(from){
  for(let ch=0;ch<4;ch++){
    const cd=BGM_CHORDS[ch],t0=from+ch*2*BGM_BAR,t1=t0+2*BGM_BAR;
    cd.tones.forEach(f=>bgmPad(f,t0,2*BGM_BAR+.8,.05));
    for(let e=0;e<16;e++){
      if(Math.random()<.58){
        const f=cd.tones[Math.floor(Math.random()*cd.tones.length)]*2;
        bgmPluck(f,t0+e*BGM_BEAT/2+Math.random()*.03,.075);
      }
    }
    bgmBell(cd.bell,t0,.042);
    bgmPluck(cd.root/2,t1-BGM_BAR*.5,.05);
  }

function bgmTick(){
  try{
    const c=_audioCtx;if(!c)return;
    if(c.currentTime>=bgm.nextT-1.5){
      bgmScheduleLoop(bgm.nextT);
      bgm.nextT+=BGM_LOOP;
    }
  }catch(e){}
}
function bgmStart(){
  if(bgm.on||!bgmEnabled())return;
  try{
    const c=bgmCtx();if(!c)return;
    /* suspended 상태에서 스케줄하면 일부 브라우저가 이벤트를 버린다 — running이 되면 시작 */
    if(c.state!=="running"){
      c.resume().then(()=>{if(bgmEnabled()&&!bgm.on)bgmStart();}).catch(()=>{});
      return;
    }
    if(!bgm.master){bgm.master=c.createGain();bgm.master.connect(c.destination);}
    bgm.master.gain.cancelScheduledValues(c.currentTime);
    bgm.master.gain.setValueAtTime(bgm.master.gain.value,c.currentTime);
    bgm.master.gain.linearRampToValueAtTime(1,c.currentTime+.9);
    bgm.on=true;
    if(bgm.nodes.length===0)bgmAir();
    bgm.nextT=c.currentTime+.12;
    bgmScheduleLoop(bgm.nextT);
    bgm.nextT+=BGM_LOOP;
    bgm.timer=setInterval(bgmTick,700);
    if(!bgm.hinted){bgm.hinted=true;toast("♪ 배경 음악이 시작됐어요","ok");}
  }catch(e){}
}
function bgmStop(){
  if(!bgm.on)return;
  bgm.on=false;
  if(bgm.timer){clearInterval(bgm.timer);bgm.timer=null;}
  try{
    const c=_audioCtx;
    if(c&&bgm.master){
      bgm.master.gain.cancelScheduledValues(c.currentTime);
      bgm.master.gain.setValueAtTime(bgm.master.gain.value,c.currentTime);
      bgm.master.gain.linearRampToValueAtTime(0.0001,c.currentTime+.6);
    }
    const dead=bgm.nodes;bgm.nodes=[];
    setTimeout(()=>{dead.forEach(n=>{try{n.stop(0)}catch(e){}});},700);
  }catch(e){bgm.nodes=[];}
}
function bgmToggle(){
  const on=!bgmEnabled();
  Store.settings.bgm=on;Store.saveSettings();
  if(on)bgmStart();else bgmStop();
  bgmBtnUI();
  toast(on?"배경 음악을 켰어요 ♪":"배경 음악을 껐어요","ok");
}
function bgmBtnUI(){
  const b=$("#bgm-btn");if(!b)return;
  b.classList.toggle("bgm-off",!bgmEnabled());
  b.setAttribute("aria-pressed",bgmEnabled()?"true":"false");
}
function bgmKick(){
  if(!bgmEnabled()||bgm.on)return;
  bgmStart();
}
["pointerdown","keydown","touchstart","wheel"].forEach(ev=>document.addEventListener(ev,bgmKick,{passive:true}));

 {id:"t13",cat:"용어",name:"발상 기법",en:"ideation",one:"주제를 깊게 파는 사고 도구: 브레인스토밍, 마인드맵, 관점 바꾸기, SCAMPER.",
  detail:"[12미02-01] 다양한 발상으로 주제를 심화하는 것이 표현의 시작이에요. 브레인스토밍(판단 없이 아이디어 쏟아내기), 마인드맵(중심어에서 가지 뻗기), 관점 바꾸기(다른 사람·사물의 눈으로 보기), SCAMPER(대체·결합·조정·변형·다른 용도·없애기·재배열)가 대표적입니다.",
  point:"'하루'라는 단어로 마인드맵을 그려 최소 10개의 연상 단어를 뽑은 뒤, 그중 가장 놀라운 조합 2개를 골라 보세요."},
 {id:"t14",cat:"용어",name:"감상 4단계",en:"Feldman's method",one:"묘사 → 분석 → 해석 → 판단, 작품을 순서대로 보는 비평 방법.",
  detail:"미술교육에서 널리 쓰이는 감상 절차예요. 1) 묘사: 보이는 것만 객관적으로 말하기 2) 분석: 조형 요소와 원리가 어떻게 쓰였는지 살피기 3) 해석: 무엇을 말하려 했는지 추측하기 4) 판단: 근거를 들어 가치 평가하기. 순서를 지키면 느낌만 애매하게 남지 않습니다.",
  point:"아무 작품이나 골라 4단계 표를 만들어 한 줄씩 적어 보세요. 근거 있는 감상이 되는지 확인해 보세요."},
 {id:"t15",cat:"용어",name:"비평의 두 관점",en:"formal & contextual criticism",one:"형식 비평(작품 안)과 맥락 비평(작품 밖의 시대·사회).",
  detail:"형식 비평은 색·구도·질감처럼 작품 내부의 조형적 특징을 분석하고, 맥락 비평은 작품이 만들어진 시대·사회·작가의 삶과 연결해 봅니다. [12미03-02]처럼 미술과 시대·사회·환경의 상호 관련성을 분석하려면 두 관점을 함께 써야 해요.",
  point:"게르니카(1937)를 형식 비평(흑백, 왜곡된 형태)과 맥락 비평(스페인 내전)으로 각각 한 단락씩 분석해 보세요."},
 {id:"t16",cat:"용어",name:"여백의 미",en:"beauty of empty space",one:"동양 회화에서 비워둔 자리가 주는 여운과 긴장.",
  detail:"동양화는 다 그리지 않고 비워둔 여백으로 무한한 공간과 여운을 만들어요. 여백은 '없는 것'이 아니라 눈을 쉬게 하고 상상을 켜는 조형 요소입니다.",
  point:"그림 한 장의 여백을 검은 색으로 칠해 보세요. 여백이 사라졌을 때 무엇이 잃는지 기록해 보세요."},
 /* --- 작가: 한국 --- */
 {id:"a01",cat:"작가",name:"김환기",en:"Kim Whanki",years:"1913~1974",one:"달·나무·새 같은 한국적 모티프를 추상으로 정제한 서양화가.",
  detail:"1963년 뉴욕으로 건너가 한국의 전통과 추상 회화를 잇는 작업을 했어요. 청자(청록) 빛깔과 달·나무·새 모티프를 화면에 정돈한 작품이 대표적이며, 우리나라 미술품 경매 최고 신기록을 여러 차례 세운 작가로 알려져 있습니다.",
  point:"청자 색이 주는 분위기는 무엇일까요? 같은 모티프를 나만의 색으로 바꿔 그려 보세요.",rel:["w06"]},
 {id:"a02",cat:"작가",name:"이중섭",en:"Lee Jung-seob",years:"1916~1956",one:"호(號)가 대향(大鄕). 흙벽돌과 종이 뒷면에 소를 그린 서양화가.",
  detail:"전쟁과 분단의 시기를 지나며 가난 속에서도 가족과 소, 어린 시절을 그렸어요. 물감이 없어 흙벽돌 면을 문질러 분을 얻거나 신문지·달력지 뒷면에 그린 화려한 소 그림이 유명합니다. 데생에 깊은 작가로도 알려져 있어요.",
  point:"재료가 부족했던 상황이 오히려 새로운 표현을 만들었다는 점을 생각해 보세요. 주변 재료로 그림 하나를 그려 보세요.",rel:["w07"]},
 {id:"a03",cat:"작가",name:"박수근",en:"Park Soo-keun",years:"1914~1965",one:"돌과 같은 질감의 화면에 소박한 일상 인물을 그린 화가.",
  detail:"고향의 인물과 어린이, 가족의 일상을 그렸어요. 갈라진 돌처럼 입자가 드러나는 독특한 화면 질감과 따뜻하고 조용한 색이 특징입니다. 사후 1984년 국립현대미술관 회고전을 통해 널리 재평가되었어요.",
  point:"질감이 만드는 온기는 무엇일까요? 손톱 끝 등 도구로 거친 질감 화면을 만들어 비교해 보세요.",rel:["w08"]},
 {id:"a04",cat:"작가",name:"천경자",en:"Cheon Kyung-ja",years:"1924~2015",one:"풍경과 삶을 문학적 시선으로 그린 동양화가, 수필가.",
  detail:"동양화 기법으로 산수·풍경을 그리며 삶의 정서를 담았고, 수필로도 미술을 이야기했어요. 여성 예술가의 삶과 작품 세계를 연구하는 데 중요한 작가로 평가받습니다.",
  point:"풍경화는 사진과 무엇이 다를까요? 내가 좋아하는 장소를 '나의 정서를 담아' 그려 보세요."},
 {id:"a05",cat:"작가",name:"문신",en:"Moon Shin",years:"1941~2023",one:"인체의 균형과 조화를 단순한 형태로 조각한 조각가.",
  detail:"인간 형상을 둥글고 단순한 형태로 정제한 조각 작업으로 널리 알려져 있으며, 마산에 작품과 삶을 보여주는 공간(문신 미술관)이 조성되어 있습니다. '균형'을 작업의 핵심으로 삼은 작가예요.",
  point:"과감히 단순화된 형태가 왜 더 강한 인상을 주는지 생각해 보세요. 실물을 5개의 형태로 요약해 보세요."},
 {id:"a06",cat:"작가",name:"이불",en:"Lee Bul",years:"1967~",one:"부직포·자수·금속 메시로 기억과 몸, 기술을 다루는 조각·설치 작가.",
  detail:"부직포에 자수로 여성의 몸과 꿈을 표현한 초기 작업부터, 반짝이는 금속 메시로 만든 대형 설치 「바람」(1997)까지 재료의 반대편에 있는 의미를 짚어내는 작업을 해왔어요. 세계 주요 미술관에서 대규모 개인전을 열었습니다.",
  point:"부드러운 재료와 단단한 재료가 함께 쓰인다면, 작가는 무엇을 말하려는 걸까요?"},
 {id:"a07",cat:"작가",name:"김수자",en:"Kimsooja",years:"1957~",one:"보따리를 모티프로 이동·삶·여성의 노동을 다루는 작가.",
  detail:"침구와 옷가지를 묶은 '보따리'를 통해 이주, 가족, 여성의 삶을 다뤄왔어요. 세계 여러 도시에서 퍼포먼스 「바늘 여인」을 진행하며 몸으로 보따리가 되는 작업도 했습니다.",
  point:"보따리에는 어떤 이야기가 담길까요? 나만의 보따리(물건 묶음)를 만들고 그 의미를 설명해 보세요."},
 {id:"a08",cat:"작가",name:"서세옥",en:"Seo Se-ok",years:"1957~",one:"캔버스와 화면의 재료감 자체를 다루는 작가.",
  detail:"캔버스를 거칠게 다루어 재료의 물성(물질적 성질)을 드러내는 작업을 해왔어요. '그려진 이미지'가 아니라 '화면 자체'가 주인공이 되는 추상 작업으로 국제적으로 평가받습니다.",
  point:"그림을 '본다'와 '만진다'는 감상이 어떻게 다른지 이야기해 보세요."},
 {id:"a09",cat:"작가",name:"최정화",en:"Choi Jeong Hwa",years:"1961~",one:"대중문화의 이미지와 버려진 물건으로 시각문화를 비판적으로 되묻는 작가.",
  detail:"플라스틱 장난감, 대형 이미지 등 소비사회의 사물을 화려하고 유쾌하게 재배치해, 우리가 당연하게 소비하는 시각 문화를 되묻습니다. 공공장소에서 대중과 함께 만드는 작업도 많아요.",
  point:"[12미01-02] 우리 주변의 광고 이미지 하나를 골라 '이 이미지가 무엇을 팔려고 하는가'를 분석해 보세요."},
 /* --- 작가: 서양 --- */
 {id:"a10",cat:"작가",name:"클로드 모네",en:"Claude Monet",years:"1840~1926",one:"빛의 순간을 포착한 인상주의의 중심 작가.",
  detail:"「인상·일출」(1872)로 '인상주의'라는 이름이 붙었어요. 같은 건물과 연못을 시간·날씨별로 반복해 그리는 연작으로 빛의 변화를 연구했습니다.",
  point:"하루 중 시간에 따라 같은 대상의 색이 어떻게 변하는지 기록해 보세요.",rel:["w03"]},
 {id:"a11",cat:"작가",name:"빈센트 반 고흐",en:"Vincent van Gogh",years:"1853~1890",one:"굵고 끊긴 붓질과 뜨거운 색으로 감정을 그린 후기인상주의 화가.",
  detail:"생전에 팔린 그림이 거의 없었지만, 붓질 그 자체가 감정이 되는 회화를 남겼어요. 별·해바라기·밤 카페 같은 모티프를 강렬한 색으로 다루었습니다.",
  point:"붓질의 방향이 화면의 '움직임'을 만드는 원리를 살펴 보세요.",rel:["w02"]},
 {id:"a12",cat:"작가",name:"폴 세잔",en:"Paul Cézanne",years:"1839~1906",one:"자연을 기하학적 형태로 재구성해 현대 회화의 길을 연 후기인상주의 화가.",
  detail:"'자연을 원기둥·구·원뿔로 다루어라'는 발상으로 형태의 구조를 연구했어요. 20세기 입체파 등 현대 회화에 큰 영향을 준 작가로 평가받습니다.",
  point:"과일과 컵을 원기둥·구·원뿔로 단순화해 그려 보세요. 구조가 더 단단해지는 이유는 무엇일까요?"},
 {id:"a13",cat:"작가",name:"파블로 피카소",en:"Pablo Picasso",years:"1881~1973",one:"한 대상을 여러 시각으로 동시에 보여 준 입체파의 창시자.",
  detail:"브라크와 함께 대상을 여러 면으로 쪼개 한 화면에 놓는 입체파를 만들었어요. 「게르니카」(1937)처럼 시대의 비극을 회화 언어로 응답한 작품도 남겼습니다.",
  point:"정면과 옆면이 한 얼굴에 함께 있다면, 우리는 그 얼굴을 어떻게 보게 될까요?",rel:["w05"]},
 {id:"a14",cat:"작가",name:"살바도르 달리",en:"Salvador Dalí",years:"1904~1989",one:"꿈과 무의식을 정밀하게 그린 초현실주의 화가.",
  detail:"녹아 시들어 가는 시계처럼, 그림은 그림대로 정교하게 그리되 내용은 꿈의 논리로 배열했어요. 초현실주의를 대표하는 작가입니다.",
  point:"꿈 한 장면을 '사실적 기법'으로 그리면 어떤 효과가 생길까요?",rel:["w04"]},
 {id:"a15",cat:"작가",name:"프리다 칼로",en:"Frida Kahlo",years:"1907~1954",one:"자화상으로 정체성과 고통, 토착 문화를 그린 멕시코 화가.",
  detail:"교통사고와 질병의 고통을 겪으며 수십 점의 자화상을 남겼어요. 몸과 정체성, 멕시코 전통 문화의 이미지를 회화로 다룬 작가로 전 세계적으로 사랑받고 있습니다.",
  point:"자화상은 '나를 어떻게 보여 줄 것인가'의 문제예요. 나를 한 단어로 표현하는 자화상 계획을 세워 보세요."},
 {id:"a16",cat:"작가",name:"앤디 워홀",en:"Andy Warhol",years:"1928~1987",one:"대량생산과 소비문화의 이미지를 실크스크린으로 복제한 팝아트의 거장.",
  detail:"캠벨 스프 캔이나 유명인 얼굴을 실크스크린으로 반복 인쇄하며 '복제'와 '유명세' 자체를 미술의 재료로 만들었어요. 팝아트를 대표하는 작가입니다.",
  point:"똑같은 이미지가 반복되면 우리의 감정은 어떻게 변할까요? 좋아하는 사물 사진으로 연작을 구상해 보세요."},
 {id:"a17",cat:"작가",name:"장미셸 바스키아",en:"Jean-Michel Basquiat",years:"1960~1988",one:"거리에서 시작해 크라운과 글씨로 권력·역사를 치켜 세운 화가.",
  detail:"뉴욕 거리 벽에 SAMO© 서명으로 시작해, 뼈대·크라운·날것의 글씨로 인종과 권력, 역사 속 인물들을 다뤘어요. 20세기 말 가장 영향력 있는 화가 중 한 명입니다.",
  point:"글씨를 그림 안에 넣으면 이미지와 단어가 서로 무엇을 하게 될까요?"},
 {id:"a18",cat:"작가",name:"바르바라 크루거",en:"Barbara Kruger",years:"1945~",one:"광고 문법으로 'I shop therefore I am'을 외치며 소비사회를 되묻는 작가.",
  detail:"잡지 표지 같은 사진에 붉은 띠에 흰 굵은 글씨를 얹어, 광고가 쓰는 시각 언어를 그대로 빌려 소비·권력·성별을 비판합니다. 시각문화 비판 수업의 대표 사례예요.",
  point:"광고 문구 하나를 바꿔 똑같은 이미지에 얹으면 의미가 어떻게 뒤집히는지 실험해 보세요."},
 {id:"a19",cat:"작가",name:"쿠사마 야요이",en:"Yayoi Kusama",years:"1929~",one:"도트와 무한 반복으로 자아가 세계로 퍼져 나가는 것을 그린 작가.",
  detail:"어린 시절 본 환각 속 점 무늬를 평생의 모티프로 삼아, 회화·조각·무한거울방까지 확장했어요. 90세가 넘어서도 작업을 이어가는 세계적 작가입니다.",
  point:"반복되는 패턴이 만드는 무한감을 느껴 보세요. 나만의 패턴 하나를 만들어 연작을 구상해 보세요.",rel:["w09"]},
 {id:"a20",cat:"작가",name:"파울 클레",en:"Paul Klee",years:"1879~1940",one:"'선은 점이 산책하며 걸어간 자취'라 말한, 음악 같은 회화의 작가.",
  detail:"색과 선을 음악의 리듬처럼 다루며 아이 그림 같은 자유와 깊은 이론을 함께 담았어요. 바우하우스에서 교육자로도 활동하며 현대 미술 교육에 큰 영향을 남겼습니다.",
  point:"점에서 출발해 선이 '산책'하도록 그려 보세요. 어디로 가게 될지 모르게."},

function spawnConfetti(n){
  const colors=["#F4633A","#3E8FD0","#2FB894","#F5B940","#8A6FD0","#E85C8A"];
  const host=document.body;
  for(let i=0;i<n;i++){
    const c=document.createElement("div");c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(5+Math.random()*6)+"s";
    c.style.animationDelay=(Math.random()*7)+"s";
    c.style.opacity=.35+Math.random()*.5;
    host.appendChild(c);
  }
}

  const code=$("#s-code").value.trim().toUpperCase();
  const grade=$("#s-grade")?$("#s-grade").value:"";
  const clsNum=$("#s-cls")?$("#s-cls").value:"";
  const num=parseInt($("#s-num").value,10);
  const nick=$("#s-nick").value.trim();
  const msg=$("#s-msg");
  if(!code){msg.innerHTML=`<div class="warn-banner">학급 코드를 입력해 주세요.</div>`;return;}
  if(!num){msg.innerHTML=`<div class="warn-banner">번호를 선택해 주세요.</div>`;return;}
  if(!nick){msg.innerHTML=`<div class="warn-banner">닉네임을 입력해 주세요.</div>`;return;}
  let cls;
  try{cls=await Store.classGet(code);}
  catch(e){msg.innerHTML=`<div class="warn-banner">연결 오류: ${esc(e.message||e)}</div>`;return;}
  if(!cls){msg.innerHTML=`<div class="warn-banner">코드 <b>${esc(code)}</b>에 해당하는 학급이 없어요. 선생님께 코드를 다시 확인해 주세요.${Store.mode==="local"?" (오프라인 모드라면 교사가 이 기기에서 학급을 만들었어야 합니다.)":""}</div>`;return;}
  if(cls.joinOpen===false){msg.innerHTML=`<div class="warn-banner">교사가 입장을 잠시 닫아 두었어요. 기다렸다가 다시 시도해 주세요.</div>`;return;}
  const id=await Store.studentJoin(code,{num,nick,grade,cls:clsNum});
  Session.student={classCode:code,studentId:id,grade,cls:clsNum,num,nick};
  Session.saveStudent();
  MDTEST.add("entry.studentJoin",true);
  startStudent();
}

    const name=$("#cl-name").value.trim()||"우리 반 미술";

    const exist=await Store.classGet(code);

async function tryConnectFirebase(){
  const cfg=Store.settings.firebase;
  if(!cfg)return false;
  try{
    await Store.connectFirebase(cfg);
    if(MDTEST.on)MDTEST.add("firebase.connect",(Store.mode==="cloud")?"오프라인 테스트에서는 항상 실패 예상":true);
    return true;
  }catch(e){
    console.warn("Firebase 연결 실패:",e);
    if(MDTEST.on)MDTEST.add("firebase.connect.fail.ok",true);
    return false;
  }
}

/* ================================================================
   스케치 자동 진단 (명암·선밀도·구도·여백·중심·방향)
   ================================================================ */
function analyzeSketch(dataURL){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const W=480;
      const r=Math.min(1,W/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));
      const ctx=c.getContext("2d",{willReadFrequently:true});
      ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height);
      const d=ctx.getImageData(0,0,c.width,c.height).data;
      const n=c.width*c.height, gray=new Float32Array(n);
      for(let i=0;i<n;i++){
        const j=i*4;
        gray[i]=0.299*d[j]+0.587*d[j+1]+0.114*d[j+2];
      }
      /* 명암: 5~95퍼센트 구간 */
      const sorted=Float32Array.from(gray).sort();
      const pct=p=>sorted[Math.min(n-1,Math.floor(n*p))];
      const contrast=pct(.95)-pct(.05);
      /* 소벨 에지 */
      let edge=0,hE=0,vE=0;
      const th=60;
      for(let y=1;y<c.height-1;y++)for(let x=1;x<c.width-1;x++){
        const i=y*c.width+x;
        const gx=gray[i+1]-gray[i-1], gy=gray[i+c.width]-gray[i-c.width];
        const m=Math.hypot(gx,gy);
        if(m>th){edge++; if(Math.abs(gx)>Math.abs(gy)*1.4)vE++; else if(Math.abs(gy)>Math.abs(gx)*1.4)hE++;}
      }
      const edgeRatio=edge/n;
      /* 여백 */
      let ws=0;for(let i=0;i<n;i++)if(gray[i]>245)ws++;
      ws/=n;
      /* 사분면 균형 (어두운 픽셀의 무게) */
      const halfW=c.width>>1,halfH=c.height>>1;
      const q=[0,0,0,0];
      for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
        const dark=(255-gray[y*c.width+x])/255;
        q[(x<halfW?0:1)+(y<halfH?0:2)]+=dark;
      }
      const maxQ=Math.max(...q)||1;
      const balance=1-(Math.max(...q)-Math.min(...q))/(2*maxQ);
      /* 무게중심 이탈 */
      let sx=0,sy=0,sw=0;
      for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
        const w=(255-gray[y*c.width+x])/255;sx+=x*w;sy+=y*w;sw+=w;
      }
      const cx=sw?sx/sw:c.width/2, cy=sw?sy/sw:c.height/2;
      const off=Math.hypot(cx-c.width/2,cy-c.height/2)/(Math.min(c.width,c.height)/2);
      /* 방향성 */
      const horiz=hE>edge*0.35, vert=vE>edge*0.35;
      res({contrast:contrast/255,edgeRatio,balance,whitespace:ws,off,
        horiz,vert,w:c.width,h:c.height});
    };
    img.onerror=()=>rej(new Error("이미지를 읽지 못했습니다"));
    img.src=dataURL;
  });
}

  if(m.edgeRatio<0.05)items.push({ic:"④",col:"var(--mint)",t:"선과 디테일",

  else if(m.edgeRatio>0.28)items.push({ic:"④",col:"var(--mint)",t:"선과 디테일",
    v:"선이 화면 전체에 골고루 많아요 — 눈이 어디로 가야 할지 헤매요.",
    p:"가장 중요한 한 곳에만 디테일을 모으고, 나머지는 톤으로 단순화해 보세요."});
  else items.push({ic:"④",col:"var(--mint)",t:"선과 디테일",
    v:"선의 밀도가 적당히 배분되어 있어요.",p:"집중점(가장 디테일한 곳)이 하나인지 확인해 보세요."});
  if(m.off>0.55)items.push({ic:"⑤",col:"var(--violet)",t:"시선의 무게중심",

  else items.push({ic:"⑤",col:"var(--violet)",t:"시선의 무게중심",
    v:"무게중심이 화면 안쪽에 있어 시선이 안정적으로 머물러요.",p:"시선이 머무는 곳에 이야기의 열쇠(강조)를 하나 더해 보세요."});
  const dir=m.horiz&&m.vert?"수평·수직 선이 모두 강한 화면이에요."
    :m.horiz?"수평선 위주의 안정되고 고요한 화면이에요."
    :m.vert?"수직·사선 위주의 역동적인 화면이에요."
    :"사선이 우세한 화면이에요.";
  items.push({ic:"⑥",col:"var(--rose)",t:"선의 방향성",v:dir,
    p:dir.startsWith("수평")?"정적이고 고요한 이야기라면 그대로. 역동을 원하면 대각선 요소를 하나 더해 보세요."
      :dir.startsWith("수직")?"역동적이라면 그대로. 안정감을 원하면 수평 요소를 하나 더해 보세요."
      :"방향이 하나로 모이도록 주요 선을 정리해 보세요."});
  return items;
}
/* 진단 리포트 카드 PNG */
function diagReportPNG(dataURL,items,m){
  return new Promise(res=>{
    const c=document.createElement("canvas");c.width=800;c.height=1080;
    const g=c.getContext("2d");
    g.fillStyle="#FFF9F2";g.fillRect(0,0,800,1080);
    g.fillStyle="#F4633A";g.fillRect(0,0,800,10);
    g.fillStyle="#2D2A26";g.font="900 34px sans-serif";
    g.fillText("스케치 진단 리포트",40,72);
    g.font="600 17px sans-serif";g.fillStyle="#6B655D";
    g.fillText(`${Session.student.nick} · ${Session.student.classCode} · ${fmtTs(Date.now())}`,40,104);
    const thumb=new Image();
    thumb.onload=()=>{
      const tw=280,th=Math.round(280*thumb.height/thumb.width);
      g.fillStyle="#fff";g.strokeStyle="#EFE3D6";
      g.fillRect(40,130,tw,th);g.strokeRect(40,130,tw,th);
      g.drawImage(thumb,40,130,tw,th);
      let y=140;
      items.forEach(it=>{
        if(y+150>1080)return;
        g.fillStyle=it.col;g.fillRect(360,y,8,90);
        g.fillStyle="#2D2A26";g.font="800 21px sans-serif";
        g.fillText(it.ic+" "+it.t,380,y+28);
        g.font="600 16px sans-serif";g.fillStyle="#2D2A26";
        wrapText(g,it.v,380,y+54,380,22);
        g.fillStyle="#6B655D";
        wrapText(g,it.p,380,y+80,380,20);
        y+=130;
      });
      g.font="600 14px sans-serif";g.fillStyle="#6B655D";
      g.fillText("명암 "+Math.round(m.contrast*100)+" · 선밀도 "+Math.round(m.edgeRatio*100)+" · 균형 "+Math.round(m.balance*100)+" · 여백 "+Math.round(m.whitespace*100)+" · 중심 "+Math.round(m.off*100),40,1040);
      res(c.toDataURL("image/png"));
    };
    thumb.src=dataURL;
  });
}
function wrapText(g,text,x,y,maxW,lh){
  const words=String(text).split("");
  let line="",yy=y;
  for(const ch of words){
    if(g.measureText(line+ch).width>maxW){g.fillText(line,x,yy);line=ch;yy+=lh;}
    else line+=ch;
  }
  g.fillText(line,x,yy);
  return yy;
}

/* ================================================================
   미술 만더기 챗봇
   - 기본: 검증된 지식베이스(KB) 검색·의도 응답 (오프라인 작동, 팩트 통제)
   - 선택: 교사가 Gemini API 키를 넣으면 AI 심화 모드(오류 가능성 고지 표시)

function searchKB(text){
  const t=String(text||"").toLowerCase();
  if(t.length<2)return [];
  const tokens=t.split(/[\s,.?!~()[\]'"「」·、]+/).filter(s=>s.length>=2);
  return KB.map(e=>{
    let score=0;
    const name=e.name.toLowerCase(),en=(e.en||"").toLowerCase();
    const hay=(e.name+" "+(e.en||"")+" "+e.one+" "+e.detail+" "+(e.years||"")).toLowerCase();
    tokens.forEach(tok=>{
      if(name.includes(tok))score+=10;
      if(en.includes(tok))score+=6;
      if(hay.includes(tok))score+=2;
    });
    return {e,score};
  }).filter(x=>x.score>=4).sort((a,b)=>b.score-a.score).slice(0,4).map(x=>x.e);
}

/* EXAONE 4.5 33B — reasoning 비활성화(enable_thinking:false), 타임아웃 60초, 응답 trim */
async function exaoneAsk(text,hist){
  const kbCtx=searchKB(text).slice(0,4)
    .map(e=>"- "+e.name+(e.years?" ("+e.years+")":"")+": "+e.one).join("\n");
  const sys="반드시 한국어로 응답하세요. 너는 고등학교 미술 수업 도우미 챗봇 '만더기'다. "
    +"한국어로, 고등학생이 이해하기 쉽게 3~6문장으로 답한다. "
    +"사실 중심으로 답하고, 확실하지 않은 연도·작품명·사실은 '정확하지 않을 수 있다'고 명시한다. "
    +"학생의 개인정보를 요구하거나 수집하지 않는다. 퀴즈·활동지·아트 보드 같은 앱 기능 문의에는 해당 탭 이용을 안내한다. "
    +(kbCtx?"아래는 검증된 지식베이스 참고 자료다. 이와 충돌하면 지식베이스를 우선한다.\n"+kbCtx:"");
  const msgs=[{role:"system",content:sys}]
    .concat(hist.slice(-6).map(h=>({role:h.role==="bot"?"assistant":"user",content:h.text})))
    .concat([{role:"user",content:text}]);
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),60000);
  try{
    const r=await fetch(EXAONE_ENDPOINT,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+EXAONE_API_KEY},
      body:JSON.stringify({model:EXAONE_MODEL,messages:msgs,temperature:0.7,
        max_completion_tokens:1024,chat_template_kwargs:{enable_thinking:false},stream:false}),
      signal:ctl.signal});
    if(!r.ok)throw new Error("HTTP "+r.status+(r.status===401?" — API 키 만료/오류":""));
    const j=await r.json();
    const c=j.choices&&j.choices[0];
    const content=c&&c.message&&c.message.content;
    if(content==null){
      if(c&&c.finish_reason==="length")throw new Error("토큰 한도 초과로 응답이 잘렸어요");
      throw new Error("응답이 비어 있어요");
    }
    return String(content).trim();
  }catch(e){
    throw new Error(e.name==="AbortError"?"응답 시간 초과(60초) — 잠시 후 다시 시도해 주세요":(e.message||"네트워크 오류"));
  }finally{clearTimeout(timer);}
}
async function geminiAsk(text,hist){
  const key=Store.settings.geminiKey;
  const model=Store.settings.geminiModel||"gemini-2.0-flash";
  const url="https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+encodeURIComponent(key);
  const kbCtx=searchKB(text).slice(0,4)
    .map(e=>"- "+e.name+(e.years?" ("+e.years+")":"")+": "+e.one).join("\n");
  const sys="너는 고등학교 미술 수업 도우미 챗봇 '만더기'다. 한국어로, 고등학생이 이해하기 쉽게 3~6문장으로 답한다. "
    +"사실 중심으로 답하고, 확실하지 않은 연도·작품명·사실은 '정확하지 않을 수 있다'고 명시한다. "
    +"학생의 개인정보를 요구하거나 수집하지 않는다. 퀴즈·활동지·아트 보드 같은 앱 기능 문의에는 해당 탭 이용을 안내한다. "
    +(kbCtx?"아래는 검증된 지식베이스 참고 자료다. 이와 충돌하면 지식베이스를 우선한다.\n"+kbCtx:"");
  const contents=hist.slice(-6).map(h=>({role:h.role==="bot"?"model":"user",parts:[{text:h.text}]}));
  contents.push({role:"user",parts:[{text}]});
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents})});
  if(!r.ok){
    let msg="API 오류 "+r.status;
    try{const j=await r.json();if(j.error&&j.error.message)msg=j.error.message;}catch(e){}
    throw new Error(msg);
  }
  const j=await r.json();
  const parts=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
  return (parts&&parts.map(p=>p.text||"").join("")||"(응답이 비어 있어요)");
}

/* ---- 영역별 단계 모드 (영역 3 × 5단계 × 5문항) ---- */
const AREAS=[
 {id:"a1",name:"미적 체험",prefix:"[12미01"},
 {id:"a2",name:"표현",prefix:"[12미02"},
 {id:"a3",name:"감상",prefix:"[12미03"}];
const STAGE_NAMES=["발상 준비","기초 다지기","심화 탐구","표현 확장","마스터 도전"];
function areaStagePlan(areaId){
  const area=AREAS.find(a=>a.id===areaId);
  const qs=QUIZ.filter(q=>q.std&&q.std.startsWith(area.prefix));
  const by=l=>qs.filter(q=>q.level===l).slice().sort(()=>Math.random()-.5);
  const h=by("하"),m=by("중"),s=by("상");
  const tk=(arr,n)=>arr.splice(0,n);
  const plan=[[...tk(h,5)],[...tk(h,2),...tk(m,3)],[...tk(m,5)],[...tk(m,2),...tk(s,3)],[...tk(s,5)]];
  return plan.map(a=>a.sort(()=>Math.random()-.5));
}

function startStageQuiz(areaId,stage){

function startQT(){
  stopQT();
  quiz.timer=13;
  quiz.timerInt=setInterval(()=>{
    quiz.timer=Math.max(0,quiz.timer-0.1);
    const bar=$("#q-timer-bar"),num=$("#q-timer-num");

    if(num)num.textContent=Math.ceil(quiz.timer);
    if(quiz.timer<=0){stopQT();quizDead("시간 초과!");}
  },100);
}
function stopQT(){if(quiz&&quiz.timerInt){clearInterval(quiz.timerInt);quiz.timerInt=null;}}
function quizDead(reason){
  if(!quiz||quiz.solved)return;
  quiz.dead=true;quiz.deadReason=reason;quiz.solved=true;
  const q=quiz.qs[quiz.qi];
  quiz.detail.push({qid:q.id,std:q.std,res:"wrong"});
  quiz.wrongs.push(q);
  sndBad();spawnConfetti(6);
  finishQuiz();
}
function pickOpt(i,btn){
  const q=quiz.qs[quiz.qi];
  if(quiz.solved||quiz.dead)return;
  stopQT();
  quiz.attempts++;
  const opts=$$("#student-body .qopt");
  opts.forEach(o=>o.classList.remove("wrong-pick"));
  if(i===q.ans){
    quiz.solved=true;
    const first=quiz.attempts===1;
    const pts=first?10+quiz.streak*2:5;
    quiz.score+=pts;quiz.streak=first?quiz.streak+1:0;
    quiz.detail.push({qid:q.id,std:q.std,res:first?"correct":"fixed"});
    btn.classList.add("correct");
    opts.forEach(o=>o.disabled=true);
    if(quiz.mode==="stage")sndHatch();else sndOk();
    spawnConfetti(14);
    if(quiz.mode==="stage"){
      const eg=$("#q-egg");
      if(eg){eg.innerHTML=eggSVG(Math.min(4,quiz.detail.filter(d=>d.res==="correct").length),false,108);

    $("#q-extra").innerHTML=`
    <div class="quiz-feedback qf-good"><div class="quiz-mascot">${quiz.mode==="stage"?eggSVG(Math.min(4,quiz.detail.filter(d=>d.res==="correct").length),false,84):mascotSVG(84,"happy")}</div><b>${first?(quiz.mode==="stage"?"정답! 계란이 부활했어요! +"+pts+"점":"정답! +"+pts+"점"):"스스로 고친 정답! +5점"}</b>

    quiz.streak=0;
    btn.classList.add("wrong-pick");
    if(quiz.mode==="stage"){quizDead("오답 — 계란 부기가 죽었어요");return;}
    const lvl=quiz.attempts; /* 1→힌트1, 2→힌트2, 3→해설 */
    sndBad();
    let extra="";
    if(lvl===1){
      extra=`<div class="quiz-hint"><div class="quiz-mascot-sm">${mascotSVG(58,"sad")}</div><div class="qh-body"><div class="qh-t">만더기 힌트 1</div>${esc(q.hint1)}
        <div class="hint">골라 보세요 — 스스로 고친 정답도 점수가 있어요!</div></div></div>`;

    }else{
      quiz.detail.push({qid:q.id,std:q.std,res:"wrong"});
      quiz.wrongs.push(q);
      opts.forEach(o=>{o.disabled=true;if(+o.dataset.i===q.ans)o.classList.add("correct");});

function finishStage(){

  const c3=`<path d="M116,91 l-8,8 9,7 -8,10" stroke="#C9B79B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  const beakSmall=`<path d="M95,110 L107,116 L95,122 Z" fill="${bk}"/>`;

    <path d="M96,99 L106,103 L96,107 Z" fill="${bk}"/></g>`;
  const anim=dead?"egg-die":(step===0?"egg-idle":"egg-wo");
  const open=(w)=>`<svg class="egg-svg ${w}" viewBox="0 0 200 200" style="width:${sz}px;height:${sz}px" role="img" aria-label="부화 계란">`;
  if(dead){
    return open(anim)+full+c1+c3+spots+eyesDead+blush+`<path d="M70,140 l8,5 7,-5 7,5" stroke="#B8A98F" stroke-width="2.5" fill="none"/></svg>`;
  }
  if(step>=5){

    <path d="M132,110 q11,2 2,13 q-11,1 -13,-6" fill="${yolk}" stroke="${yedge}" stroke-width="3"/>

    ${capTilt}</svg>`;
  }
  if(step>=4){
    return open(anim)+bottomHalf+headPeek+capTilt+`</svg>`;
  }
  let inner=full+spots+blush;
  if(step>=3)inner+=eyesOpen+beakSmall;
  else if(step>=1)inner+=eyesOpen;
  else inner+=eyesSleep;
  if(step>=1)inner+=c1;
  if(step>=2)inner+=c2+c3;
  return open(anim)+inner+`</svg>`;
}

async function onSheetSubmit(e){
  const f=e.target.files[0];if(!f)return;

    payload={imageB64:null,dataB64:await fileToDataURL(f)};
  }else{
    payload={imageB64:await compressImage(f,1000,0.7),dataB64:null};
  }
  try{
    await Store.recordSave(Session.student.classCode,Session.student.studentId,"sheetSubmit",
      {...payload,name:f.name});
    toast("활동지를 제출했어요!","ok");
    if(MDTEST.on)MDTEST.add("library.sheetSubmit",true);
  }catch(err){toast("제출 실패: "+err.message,"err");}

function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);
  });
}

function buildReflectPNG(r){
  return new Promise(res=>{
    const c=document.createElement("canvas");c.width=900;c.height=1350;
    const g=c.getContext("2d");
    g.fillStyle="#FFF9F2";g.fillRect(0,0,900,1350);
    g.fillStyle="#F4633A";g.fillRect(0,0,900,12);
    g.fillStyle="#2D2A26";g.font="900 40px sans-serif";
    g.fillText("작품 성찰카드",40,84);
    g.font="600 18px sans-serif";g.fillStyle="#6B655D";
    g.fillText(`만덕 아트 클래스 · ${Session.student.nick} · ${fmtTs(r.ts)}`,40,118);
    const img=new Image();
    img.onload=()=>{
      const maxW=820,maxH=520;
      const sc=Math.min(maxW/img.width,maxH/img.height);
      const w=img.width*sc,h=img.height*sc;
      g.strokeStyle="#EFE3D6";g.fillStyle="#fff";
      g.fillRect(40,150,w,h);g.strokeRect(40,150,w,h);
      g.drawImage(img,40,150,w,h);
      let y=210+h;
      g.fillStyle="#2D2A26";g.font="800 30px sans-serif";
      g.fillText(r.title,40,y);y+=44;
      g.font="600 18px sans-serif";g.fillStyle="#6B655D";
      g.fillText([r.size,r.materials].filter(Boolean).join(" · ")||"",40,y);y+=40;
      const put=(label,val)=>{
        if(!val)return;
        g.fillStyle="#F4633A";g.font="800 16px sans-serif";
        g.fillText(label,40,y);y+=26;
        g.fillStyle="#2D2A26";g.font="500 18px sans-serif";
        y=wrapText(g,val,40,y,820,25)+14;
      };
      put("제작 의도",r.intent);put("잘 된 점",r.good);
      put("아쉬운 점",r.bad);put("보완할 점",r.next);put("성찰",r.refl);
      g.font="600 14px sans-serif";g.fillStyle="#6B655D";
      g.fillText("2022 개정 교육과정 「미술」 성취기준 기반 성찰 기록",40,1320);
      res(c.toDataURL("image/png"));
    };
    img.onerror=()=>res(c.toDataURL("image/png"));
    img.src=r.imageB64;
  });
}

function renderTAnalytics(body){
  const students=tData.students;
  const quizzes=tData.records.filter(r=>r.type==="quiz");
  const agg={};
  STANDARDS.forEach(s=>agg[s.code]={ok:0,fx:0,bad:0});
  quizzes.forEach(r=>(r.payload&&r.payload.detail||[]).forEach(d=>{
    if(!agg[d.std])agg[d.std]={ok:0,fx:0,bad:0};
    agg[d.std][d.res==="correct"?"ok":d.res==="fixed"?"fx":"bad"]++;
  }));
  const cell=(code)=>{
    const a=agg[code],tot=a.ok+a.fx+a.bad;
    if(!tot)return {bg:"#F0EBE4",tx:"var(--ink2)",label:"-"};
    const rate=(a.ok+a.fx*0.5)/tot;
    const bg=rate>=0.8?"var(--mint)":rate>=0.5?"var(--sun)":"#D64545";
    return {bg,tx:"#fff",label:Math.round(rate*100)};
  };
  const weakest=Object.keys(agg).map(k=>({k,tot:agg[k].ok+agg[k].fx+agg[k].bad,
    rate:agg[k].bad/Math.max(1,agg[k].ok+agg[k].fx+agg[k].bad)}))
    .filter(x=>x.tot>=3).sort((a,b)=>b.rate-a.rate)[0];
  body.innerHTML=`
  <div class="h-title">퀴즈 분석 — 어려워하는 부분 파악</div>
  <p class="h-sub">형성평가 기록 ${quizzes.length}건을 성취기준별로 모아 보았어요. 진한 색일수록 습득이 잘 된 단원입니다.</p>
  <div class="card" style="margin-top:12px">
    <div class="heatmap">
      ${STANDARDS.map(s=>{const c=cell(s.code);
        return `<div class="heat-cell" style="background:${c.bg};color:${c.tx}" title="${esc(s.code)} ${esc(s.area)}">${c.label}</div>`;}).join("")}
    </div>
    <div class="hint" style="margin-top:8px">왼쪽부터 [12미01-01] → [12미03-04] (미적 체험 4 · 표현 4 · 감상 4)</div>
    ${weakest?`<div class="warn-banner" style="margin-top:12px">클래스에서 가장 어려워하는 기준: <b>${esc(weakest.k)}</b> ${esc(stdByCode(weakest.k).area)} — 오답률 ${Math.round(weakest.rate*100)}%<br>
      추천: ${esc(stdByCode(weakest.k).text.slice(0,40))}… 관련 힌트 자료(${esc(weakest.k)})를 수업에서 다시 짚어 주세요.</div>`:""}
  </div>
  <div class="card" style="margin-top:14px;padding:8px">
    ${students.length?`<div class="tbl-scroll"><table class="tbl">
      <thead><tr><th>학생</th><th>최근 점수</th><th>복습 필요 기준</th><th>추천 피드백</th><th></th></tr></thead>
      <tbody>${students.map(s=>{
        const mine=quizzes.filter(r=>r.studentId===s.id);
        const last=mine[mine.length-1];
        const wrongStd={};
        mine.forEach(r=>(r.payload&&r.payload.detail||[]).forEach(d=>{
          if(d.res==="wrong")wrongStd[d.std]=(wrongStd[d.std]||0)+1;}));
        const list=Object.keys(wrongStd).sort((a,b)=>wrongStd[b]-wrongStd[a]).slice(0,3);
        const msg=list.length?
          `${list[0]} ${stdByCode(list[0]).area} 영역에서 스스로 수정 연습이 필요해요`:
          "아직 평가 기록이 없어요";
        return `<tr><td>${esc(stuLabel(s))} ${esc(s.nick)}</td>
          <td>${last&&last.payload?`<b>${last.payload.score}</b>/${last.payload.total*10}`:'<span class="hint">—</span>'}</td>
          <td>${list.map(k=>`<span class="tag tag-gray">${esc(k)}</span>`).join(" ")||'—'}</td>
          <td style="font-size:12px;color:var(--ink2)">${esc(msg)}</td>
          <td><button class="btn btn-ghost btn-sm" data-fb="${s.id}" data-msg="${esc(msg)}">보내기</button></td></tr>`;}).join("")}
      </tbody></table></div>`
    :`<div class="empty-note">학생 기록이 모이면 이곳에서 어려운 부분을 자동 분석해 드려요.</div>`}
  </div>`;
  $$("[data-fb]",body).forEach(b=>b.onclick=async()=>{
    const stu=tData.students.find(s=>s.id===b.dataset.fb);
    const msg=b.dataset.msg;
    await Store.feedbackSave(Session.teacherClass.code,stu.id,
      `${msg} — 다음 수업에서 함께 연습해요!`);
    toast(stu.nick+"에게 피드백을 보냈어요","ok");
  });
  if(MDTEST.on)MDTEST.add("teacher.analytics",true);
}

function selectNeisStudent(sid){neisSid=sid;goTTab("neis");}
function collectNeisFacts(sid){
  const stu=tData.students.find(s=>s.id===sid);
  const recs=tData.records.filter(r=>r.studentId===sid);
  const quizzes=recs.filter(r=>r.type==="quiz");
  const ideas=recs.filter(r=>r.type==="idea");
  const sketches=recs.filter(r=>r.type==="sketch");
  const reflects=recs.filter(r=>r.type==="reflect");
  return {stu,quizzes,ideas,sketches,reflects};
}
function genNeis(){
  const {stu,quizzes,ideas,sketches,reflects}=collectNeisFacts(neisSid);
  const parts=[];
  parts.push("「미술」과 수업에서 디지털 학습도구(아이디어 발전·자기진단·형성평가)를 활용한 수행을 진행함.");
  if(quizzes.length){
    const last=quizzes[quizzes.length-1];
    const p=last.payload||{};
    const fixed=(p.detail||[]).filter(d=>d.res==="fixed").length;
    const wrong=(p.detail||[]).filter(d=>d.res==="wrong").length;
    parts.push(`형성평가(${p.total||10}문항)에서 ${p.score||0}점을 획득했으며, ${fixed>0?"오답을 스스로 수정하는 자기주도 학습 태도를 보임":"정답률 "+Math.round((p.score||0)/((p.total||10)*10)*100)+"%로 성취함"}${wrong>0?", "+wrong+"문항은 보충이 필요함":""}.`);
    const stds=[...new Set((p.detail||[]).filter(d=>d.res!=="wrong").map(d=>d.std))];
    if(stds.length)parts.push(stds.slice(0,3).join(", ")+" 성취기준 관련 학습을 수행함.");
  }
  if(ideas.length){
    const steps=[...new Set(ideas.map(r=>r.payload&&r.payload.step).filter(Boolean))];
    if(steps.length)parts.push("아이디어 공방("+steps.join("·")+") 단계를 수행함.");
  }
  if(sketches.length){
    parts.push(`구상 스케치 자기진단 ${sketches.length}회를 통해 구도·명암·여백을 점검하고 보완 계획을 세움.`);
  }
  if(reflects.length){
    const last=reflects[reflects.length-1];
    const p=last.payload||{};
    if(p.title)parts.push(`작품 「${p.title}」을 제작하고`);
    if(p.refl)parts.push(`제작의도와 성찰(“${String(p.refl).slice(0,40)}${p.refl.length>40?"…":""}”)을 기록함`);
    if(p.next)parts.push(`보완점(${String(p.next).slice(0,30)}${p.next.length>30?"…":""})을 다음 작품에 반영할 계획을 세움`);
    parts.push(".");
  }
  let text=parts.join(" ").replace(/([.])\s+([.])+/g,".");
  text=text.replace(/\.\./g,".").replace(/\s\.$/,".");
  $("#neis-out").innerHTML=`
  <div class="card">
    <div class="row"><b>${esc(stuLabel(stu))} ${esc(stu.nick)} 초안</b><div class="spacer"></div>
      <span class="tag tag-gray" id="neis-count"></span></div>
    <div class="copy-area" style="margin-top:10px">
      <button class="btn btn-sky btn-sm copy-btn" id="neis-copy">${icoSVG("copy",15)} 복사</button>
      <textarea class="field" id="neis-text" style="min-height:160px">${esc(text)}</textarea>
    </div>
    <div class="hint" id="neis-limit" style="margin-top:8px"></div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" id="neis-trim">1,500바이트로 자동 줄이기</button>
      <button class="btn btn-ghost btn-sm" id="neis-ref">재생성</button>
    </div>
  </div>`;
  const ta=$("#neis-text");
  const upd=()=>{
    const b=neisBytes(ta.value);
    const el=$("#neis-count");
    el.textContent=b+" / 1,500 바이트";
    el.className="tag "+(b<=1500?"tag-mint":"tag-coral");
    $("#neis-limit").innerHTML=b<=1500?
      `여유 ${(1500-b)}바이트 — 나이스 입력창에 그대로 붙여 넣을 수 있어요.`:
      `<b style="color:#D64545">초과 ${b-1500}바이트</b> — '자동 줄이기'를 누르거나 직접 고쳐 주세요.`;
  };
  ta.oninput=upd;upd();
  $("#neis-copy").onclick=()=>copyText(ta.value,"초안을 복사했어요 — 나이스에 붙여 넣어 주세요");
  $("#neis-trim").onclick=()=>{ta.value=trimNeis(ta.value);upd();};
  $("#neis-ref").onclick=genNeis;
  if(MDTEST.on)MDTEST.add("teacher.neis",true);
}
function trimNeis(text){
  let t=String(text).trim();
  const sentences=t.split(/(?<=\.)\s+/);
  let out=sentences;
  while(neisBytes(out.join(" "))>1490&&out.length>1)out=out.slice(0,-1);
  let res=out.join(" ");
  while(neisBytes(res)>1500)res=res.slice(0,-2);
  return res;
}

  </div>
