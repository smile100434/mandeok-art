    <div class="h-title" style="font-size:16px">2. 만더기 AI 심화 모드 — EXAONE(내장) / Gemini</div>
    <div class="setup-step" style="margin-top:10px"><div class="ss-n">1</div><div>기본 엔진은 <b>EXAONE 4.5 33B(한국어 특화)</b>가 내장되어 있어요 — 추가 설정 없이 지식베이스에 없는 질문에 AI가 답합니다. Gemini를 쓰려면 아래에서 전환하세요.</div></div>
    <label class="lbl">AI 엔진</label>
    <select class="field" id="set-ai-prov">
      <option value="exaone" ${st.aiProvider!=="gemini"?"selected":""}>EXAONE(내장 · 기본)</option>
      <option value="gemini" ${st.aiProvider==="gemini"?"selected":""}>Gemini(API 키 필요)</option>
    </select>
    <label class="lbl">Gemini API 키(EXAONE 사용 시 불필요)</label>
    <input class="field" id="set-gk" type="password" value="${esc(st.geminiKey||"")}" placeholder="AIza…">
    <label class="lbl">Gemini 모델</label>
    <input class="field" id="set-gm" value="${esc(st.geminiModel||"gemini-2.0-flash")}" placeholder="gemini-2.0-flash">
    <div class="row" style="margin-top:10px;flex-wrap:wrap">
      <button class="btn btn-coral" id="set-g-save">저장</button>
      <button class="btn btn-ghost" id="set-g-test">테스트</button>
      <button class="btn btn-ghost" id="set-g-clear">지우기</button>
    </div>
    <div class="hint">AI 답변은 '오류 가능성' 고지와 함께 표시됩니다. 중요한 사실은 지식베이스나 출처로 확인하세요.</div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="h-title" style="font-size:16px">3. 우리 반 아트 보드 — 설정 불필요</div>
    <div class="hint" style="margin-top:8px">학생이 성찰실에 작품을 등록하면 <b>아트 보드</b> 탭에 자동으로 모입니다. 별도 설정·외부 서비스 없이 앱 안에서 운영되며, 오프라인 모드에서는 이 기기에, Firebase 연결 시에는 클라우드에 저장돼요.</div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="h-title" style="font-size:16px">4. 학급 관리</div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap">
      <button class="btn btn-sky" id="set-newclass">새 학급 만들기</button>
      <button class="btn btn-ghost" id="set-export">데이터 내보내기(JSON)</button>
    </div>
    ${Session.teacherAuth?`<button class="btn btn-ghost" id="set-logout" style="margin-top:10px">구글 로그아웃</button>`:""}
    <div class="hint">데이터 내보내기는 이 기기에 저장된 로컬 기록을 백업 파일로 만들어요.</div>
  </div>`;
  $("#set-rule-copy").onclick=()=>{
    const ta=$("#set-rule-copy").closest(".copy-area").querySelector("textarea");
    copyText(ta.value,"규칙을 복사했어요");
  };
  $("#set-fb-save").onclick=async()=>{
    let cfg=null;
    try{
      const raw=$("#set-fb").value.trim().replace(/^const\s+firebaseConfig\s*=\s*/,"").replace(/;\s*$/,"");
      cfg=JSON.parse(raw.replace(/'/g,'"').replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":'));
    }catch(e){toast("config 형식을 확인해 주세요(JSON)","err");return;}
    toast("연결 테스트 중…");
    Store.settings.firebase=cfg;
    try{
      await Store.connectFirebase(cfg);
      Store.saveSettings();
      toast("Firebase 연결 성공!","ok");
      if(MDTEST.on)MDTEST.add("settings.firebase",(Store.mode==="cloud"));
      renderTSettings($("#teacher-body"));
    }catch(e){
      toast("연결 실패: "+(e.message||"네트워크"),"err");
      toast("설정은 저장해 두었어요 — 인터넷 연결 후 다시 시도하세요","ok");
      Store.saveSettings();
    }
  };
  $("#set-fb-clear").onclick=()=>{Store.settings.firebase=null;Store.saveSettings();toast("연결 정보를 지웠어요");renderTSettings($("#teacher-body"));};
  $("#set-g-save").onclick=()=>{Store.settings.aiProvider=$("#set-ai-prov").value;Store.settings.geminiKey=$("#set-gk").value.trim();Store.settings.geminiModel=$("#set-gm").value.trim()||"gemini-2.0-flash";Store.saveSettings();toast("저장했어요","ok");};
  $("#set-g-clear").onclick=()=>{Store.settings.geminiKey="";$("#set-gk").value="";Store.saveSettings();toast("키를 지웠어요");};
  $("#set-g-test").onclick=async()=>{
    Store.settings.aiProvider=$("#set-ai-prov").value;
    Store.settings.geminiKey=$("#set-gk").value.trim();Store.saveSettings();
    toast("테스트 중…");
    try{const r=await aiAsk("한 문장으로 인사해 줘",[]);
      toast("AI 응답 수신: "+r.slice(0,40),"ok");
      if(MDTEST.on)MDTEST.add("settings.gemini",true);
    }catch(e){toast("테스트 실패: "+(e.message||"네트워크"),"err");}
  };
  $("#set-g-clear").onclick=()=>{Store.settings.geminiKey="";$("#set-gk").value="";Store.saveSettings();toast("키를 지웠어요");};
  $("#set-newclass").onclick=()=>openClassModal("새 학급 만들기",Store.mode);
  $("#set-export").onclick=()=>{
    const dump={settings:{...Store.settings,firebase:Store.settings.firebase?{"__hidden__":"보안을 위해 config는 제외"}:null},
      teacherClass:Session.teacherClass,students:lsGet("cls:"+(Session.teacherClass?Session.teacherClass.code:"")+":students",[]),
      exportedAt:Date.now()};
    downloadDataURL("data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(dump,null,2)),"만덕아트클래스_백업.json");
  };
  const lo=$("#set-logout");
  if(lo)lo.onclick=()=>{Session.teacherAuth=null;Session.saveTeacherAuth();toast("로그아웃했어요");renderTSettings($("#teacher-body"));};
  if(MDTEST.on)MDTEST.add("teacher.settings",true);
}
function openSetupWizard(){
  openModal(`<h3>설정 마법사</h3>
  <p class="h-sub">Firebase config를 붙여 넣으면 구글 로그인과 학생 실시간 연동이 켜져요. 나중에 '설정' 탭에서 더 세밀히 할 수 있어요.</p>
  <textarea class="field" id="wiz-fb" style="font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:150px"
    placeholder='{ "apiKey": "…", "projectId": "…" }'></textarea>
  <div class="row" style="margin-top:12px">
    <button class="btn btn-coral" id="wiz-go" style="flex:1">연결 테스트 후 시작</button>
    <button class="btn btn-ghost" id="wiz-skip">지금은 오프라인으로</button>
  </div>`);
  $("#wiz-skip").onclick=()=>{closeModal();if(!Session.teacherClass)openClassModal("오프라인 학급 만들기","오프라인");else enterTeacher();};
  $("#wiz-go").onclick=async()=>{
    let cfg=null;
    try{
      const raw=$("#wiz-fb").value.trim();
      cfg=JSON.parse(raw);
    }catch(e){toast("config 형식을 확인해 주세요","err");return;}
    Store.settings.firebase=cfg;
    try{
      await Store.connectFirebase(cfg);Store.saveSettings();
      toast("Firebase 연결 성공!","ok");closeModal();
      if(Session.teacherAuth&&Session.teacherAuth.uid)openClassModal("학급 만들기","cloud");
      else doGoogleLogin();
    }catch(e){
      toast("연결 실패: "+(e.message||"네트워크")+" — 오프라인으로 시작할 수 있어요","err");
    }
  };
}
/* ================================================================
   초기화 · 셀프테스트
   ================================================================ */
function boot(){
  const usp=new URLSearchParams(location.search);
  $("#bgm-btn").onclick=bgmToggle;
  bgmAutostart();setTimeout(bgmAutostart,900);
  initStore().then(()=>{
    if(usp.get("selftest")==="1"){runSelfTest();return;}
    if(usp.get("join")){
      showView("view-welcome");renderWelcome(true);
      setTimeout(()=>openStudentEntry(usp.get("join")),350);
      return;
    }
    if(Session.student&&Session.student.classCode){
      startStudent();return;
    }
    if(Session.teacherClass&&Session.teacherAuth){
      enterTeacher();return;
    }
    showView("view-welcome");renderWelcome();
  }).catch(e=>{
    showView("view-welcome");renderWelcome();
    toast("초기화 오류: "+e.message,"err");
  });
}
function openStudentEntry(code,autoCode){
  entryRole="student";
  showView("view-entry");renderEntry();
  const pre=String(autoCode||code||"").toUpperCase();
  if(pre){
    const el=$("#s-code");
    if(el)el.value=pre;
    const n=$("#s-nick");
    if(n)setTimeout(()=>n.focus(),80);
  }
  return Promise.resolve();
}
/* ---------------- 셀프테스트 ---------------- */
function runSelfTest(){
  MDTEST.on=true;
  /* 테스트 상태 초기화(저장소+메모리 세션) */
  Object.keys(localStorage).filter(k=>k.startsWith("mdart:")).forEach(k=>localStorage.removeItem(k));
  Session.student=null;Session.teacherClass=null;Session.teacherAuth=null;
  Session.saveStudent();Session.saveTeacherClass();
  Store.settings={aiProvider:"exaone",firebase:null,geminiKey:"",geminiModel:"gemini-2.0-flash",padletKey:"",padletBoard:""}
  Store.saveSettings();
  _me=null;_meKey="";
  MDTEST.on=true;
  const holder=document.createElement("div");
  holder.id="selftest-results";
  holder.style.cssText="white-space:pre;font-family:monospace;font-size:12px;padding:12px;position:fixed;top:0;left:0;background:#fff;color:#000;z-index:9999";
  document.body.appendChild(holder);
  (async()=>{
    try{
      showView("view-welcome");renderWelcome();
      MDTEST.add("init.welcome",document.querySelector("#view-welcome .mascot")!==null);
      MDTEST.add("ui.welcome.doodles",$$("#view-welcome .doodle").length>=5);
      /* 실제 입장 UI 흐름(멤버십 팝업 → 버튼 클릭 기반) */
      openMembership();
      $("#w-teacher").click();
      MDTEST.add("ui.entry.teacher",!!$("#t-offline"));
      $("#t-offline").click();
      MDTEST.add("ui.classModal",!!$("#cl-ok"));
      if($("#cl-ok")){
        $("#cl-name").value="테스트반";$("#cl-code").value="TEST01";
        $("#cl-ok").click();
        await new Promise(r=>setTimeout(r,200));
      }
      MDTEST.add("ui.teacher.enter",document.querySelector("#view-teacher").classList.contains("on")&&!!$("#teacher-body"));
      $("#e-back").click();openMembership();$("#w-student").click();
      MDTEST.add("ui.entry.student",!!$("#s-join"));
      $("#s-code").value="TEST01";$("#s-num").value="7";$("#s-nick").value="학생A";
      $("#s-join").click();
      await new Promise(r=>setTimeout(r,300));
      MDTEST.add("ui.student.join",document.querySelector("#view-student").classList.contains("on")&&!!$("#student-body .h-title"));
      MDTEST.add("view.switch.hide",getComputedStyle(document.querySelector("#view-welcome")).display==="none");
      /* 학생 입장 */
      const sid1=await Store.studentJoin("TEST01",{num:"3",grade:"2",cls:"5",nick:"테스터"});
      Session.student={classCode:"TEST01",studentId:sid1,num:"3",grade:"2",cls:"5",nick:"테스터"};
      Session.saveStudent();
      await startStudent();
      let homeOk=false;
      for(let i=0;i<12&&!homeOk;i++){await new Promise(r=>setTimeout(r,150));homeOk=!!$("#student-body .h-title");}
      MDTEST.add("student.tab.home",homeOk,"html="+$("#student-body").innerHTML.slice(0,90).replace(/\s+/g," "));
      /* 탭 순회 */
      goStTab("idea");MDTEST.add("tab.idea",!!$("#student-body .step-pill"));
      goStTab("chat");MDTEST.add("tab.chat",!!$("#chat-log"));
      goStTab("quiz");MDTEST.add("tab.quiz",!!$("#q-practice"));
      goStTab("library");MDTEST.add("tab.library",!!$("#lib-grid"));
      goStTab("reflect");MDTEST.add("tab.reflect",!!$("#rf-save"));
      /* 챗봇 KB */
      const rep=botReply("구도가 뭐야?",searchKB("구도"));
      MDTEST.add("chat.kb.gudo",rep.includes("구도"));
      const rep2=botReply("아이디어가 막혔어요",[]);
      MDTEST.add("chat.intent.idea",rep2.includes("뮤즈"));
      MDTEST.add("chat.ai.exaone",typeof exaoneAsk==="function"&&typeof aiAsk==="function"&&EXAONE_API_KEY.length>40&&EXAONE_MODEL.includes("exaone-4.5-33b")&&aiReady());
      /* 퀴즈 */
      startQuiz("practice");
      MDTEST.add("quiz.play",!!$("#student-body .quiz-q"));
      /* 단계 모드(영역별 5단계) */
      const sp=areaStagePlan("a1");
      MDTEST.add("quiz.stage.plan",sp.length===5&&sp.every(s=>s.length===5));
      startStageQuiz("a1",0);
      MDTEST.add("quiz.stage.start",!!$("#student-body .quiz-q"));
      MDTEST.add("quiz.stage.timer",!!$("#q-timer-num")&&!!quiz.timerInt);
      const c0=quiz.qs[0].ans;
      document.querySelector("#student-body .qopt[data-i='"+c0+"']").click();
      MDTEST.add("quiz.stage.correct",(!!quiz.solved)&&$("#q-extra").innerHTML.indexOf("mascot")>-1);
      MDTEST.add("quiz.stage.hatch",quiz.detail.filter(d=>d.res==="correct").length===1&&$("#student-body").innerHTML.indexOf("egg-svg")>-1);
      MDTEST.add("quiz.stage.sounds",typeof sndOk==="function"&&typeof sndBad==="function"&&typeof sndFanfare==="function"&&typeof sndHatch==="function");
      $("#q-next").click();
      MDTEST.add("quiz.stage.next",quiz.qi===1&&quiz.attempts===0);
      /* 나머지 4문항 모두 정답 → 단계 클리어 → 전체 축하 오버레이 */
      let guard=0;
      while(quiz&&quiz.qi<quiz.qs.length&&guard++<10){
        document.querySelector("#student-body .qopt[data-i='"+quiz.qs[quiz.qi].ans+"']").click();
        const nb=$("#q-next");if(!nb)break;nb.click();
      }
      MDTEST.add("quiz.stage.cheer",!!$("#cheer-root"));
      quiz=null;goStTab("quiz");
      MDTEST.add("quiz.hub.stageCard",!!$("#q-stage"));
      /* 13초 초과 → 계란 죽음 → 결과 화면 */
      startStageQuiz("a2",0);
      await new Promise(r=>setTimeout(r,14400));
      MDTEST.add("quiz.stage.timeout",quiz&&quiz.dead===true&&$("#student-body").innerHTML.indexOf("부기가 죽었어요")>-1);
      quiz=null;
      /* 아이디어 5단계 */
      goStTab("idea");
      MDTEST.add("idea.step-topic",!!$("#tw-center"));
      ideaGet().step="sketch";ideaSave();renderIdea($("#student-body"));
      MDTEST.add("idea.step-sketch",!!$("#sk-run"));
      ideaGet().step="topic";ideaSave();renderIdea($("#student-body"));
      /* 스케치 진단(합성 이미지) */
      const c=document.createElement("canvas");c.width=300;c.height=300;
      const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,300,300);
      g.fillStyle="#333";g.fillRect(60,60,180,180);
      let rep3=null,skerr="";
      try{rep3=await analyzeSketch(c.toDataURL("image/jpeg"));}catch(e){skerr=e.message||String(e);}
      MDTEST.add("sketch.analyze",!!rep3&&typeof rep3.balance==="number"&&rep3.w>=1&&buildAdvice(rep3).length>=3,rep3?("w="+rep3.w+",bal="+rep3.balance.toFixed(2)):"err="+skerr);
      /* 교사 데이터 흐름 */
      await Store.recordSave("TEST01",sid1,"quiz",{score:60,total:10,detail:[{qid:"q01",std:"[12미03-01]",res:"fixed"}]});
      Session.teacherClass={code:"TEST01",name:"테스트반"};Session.saveTeacherClass();
      tData=await loadTeacherData();
      MDTEST.add("teacher.load",(tData.students.length>=1)&&(tData.records.length>=1));
      /* 교과세특 바이트 계산 */
      const b=neisBytes("한글A1\n");
      MDTEST.add("neis.bytes",(b===10));
      /* 교과세특 화면 */
      goTTab("neis");neisSid=sid1;
      MDTEST.add("teacher.neis.ui",!!$("#neis-gen"));
      genNeis();
      MDTEST.add("teacher.neis.gen",!!$("#neis-text"));
      const nb=neisBytes($("#neis-text").value);
      MDTEST.add("teacher.neis.limit",(nb<=1500));
      /* 자료실 카드 */
      goStTab("library");
      MDTEST.add("library.kb.count",$("#lib-grid .kb-card")!==null);
      /* 성찰 등록 */
      goStTab("reflect");
      $("#rf-title").value="테스트 작품";
      reflectGet().push({id:"r1",title:"테스트 작품",size:"10×10cm",materials:"연필",intent:"테스트",good:"좋음",bad:"아쉬움",next:"보완",refl:"성찰",imageB64:c.toDataURL("image/jpeg"),ts:Date.now()});
      meSet(meGet());
      await Store.recordSave("TEST01",sid1,"reflect",{imageB64:c.toDataURL("image/jpeg"),title:"테스트 작품",refId:"r1"});
      await Store.feedbackSave("TEST01",sid1,"잘했어요!","r1");
      await drawReflectList();
      MDTEST.add("reflect.list",!!document.querySelector("#rf-list .card"));
      MDTEST.add("reflect.comment",document.querySelector("#rf-list").innerHTML.includes("잘했어요!"));
      /* 내장 아트 보드 */
      await openClassBoard();
      MDTEST.add("board.open",!!document.querySelector(".board-grid .board-card"));
      const bc=document.querySelector(".board-grid .board-card");
      let detOk=false;
      if(bc){bc.click();await new Promise(r=>setTimeout(r,250));detOk=!!$("#cmt-input")&&!!$("#cmt-send");}
      MDTEST.add("board.detail",detOk);
      if(detOk){
        $("#cmt-input").value="색이 정말 밝아서 좋아요!";
        $("#cmt-send").click();
        await new Promise(r=>setTimeout(r,200));
        MDTEST.add("board.comment",document.querySelector("#modal-box").innerHTML.indexOf("색이 정말 밝아서 좋아요!")>-1);
      }else MDTEST.add("board.comment",false,"상세 미표출");
      closeModal();
      Session.teacherClass={code:"TEST01",name:"테스트반"};Session.saveTeacherClass();
      goTTab("board");
      await new Promise(r=>setTimeout(r,300));
      MDTEST.add("teacher.board",!!$("#teacher-body .board-grid"));
      await drawReflectList();
      MDTEST.add("reflect.boardbtn",!!document.querySelector("#rf-list [data-board]"));
      /* 배경 음악(합성 루프) */
      MDTEST.add("bgm.api",typeof bgmStart==="function"&&typeof bgmToggle==="function"&&typeof bgmScheduleLoop==="function"&&!!$("#bgm-btn"));
      $("#bgm-btn").click();
      MDTEST.add("bgm.off",Store.settings.bgm===false&&$("#bgm-btn").classList.contains("bgm-off"));
      $("#bgm-btn").click();
      MDTEST.add("bgm.on",Store.settings.bgm!==false&&!$("#bgm-btn").classList.contains("bgm-off"));
      MDTEST.add("bgm.chords",BGM_CHORDS.length===4&&BGM_CHORDS.every(c=>c.tones.length===4));
      /* 총평 */
      const fails=MDTEST.results.filter(r=>!r.ok);
      holder.textContent="SELFTEST "+(fails.length?"FAIL("+fails.length+")":"ALL PASS")+"\n"
        +MDTEST.results.map(r=>(r.ok?"PASS":"FAIL")+": "+r.name+(r.note?" | "+r.note:"")).join("\n");
      document.title=fails.length?"SELFTEST FAIL":"SELFTEST PASS";
    }catch(e){
      MDTEST.add("selftest.exception:"+e.message,false);
      holder.textContent="SELFTEST EXCEPTION\n"
        +MDTEST.results.map(r=>(r.ok?"PASS":"FAIL")+": "+r.name+(r.note?" | "+r.note:"")).join("\n")
        +"\n"+(e.stack||e.message);
      document.title="SELFTEST EXCEPTION";
    }
  })();
}
boot();
</script>
